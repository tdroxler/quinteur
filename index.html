<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quinteur - Exercice de Théorie Musicale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 Quinteur</h1>
        <p class="subtitle">Exercices de Théorie Musicale</p>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="fifths">Quintes</button>
            <button class="tab-btn" data-tab="notes">Lecture de Notes</button>
            <button class="tab-btn" data-tab="time-signatures">Signature Rythmique</button>
        </div>

        <div id="fifths-exercise" class="exercise-content active">
        <div class="score-board">
            <div class="score-item">
                <span class="label">Correct:</span>
                <span id="correct-count" class="count">0</span>
            </div>
            <div class="score-item">
                <span class="label">Total:</span>
                <span id="total-count" class="count">0</span>
            </div>
            <div class="score-item">
                <span class="label">Série:</span>
                <span id="streak-count" class="count">0</span>
                <span class="label">/5</span>
            </div>
        </div>

        <div class="question-box">
            <h2 id="question">Quelle est la quinte ascendante de Do?</h2>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="note-selector">
            <div class="selector-section">
                <h3 class="selector-label">Note</h3>
                <div class="note-buttons">
                    <button class="note-btn" data-letter="C">Do</button>
                    <button class="note-btn" data-letter="D">Ré</button>
                    <button class="note-btn" data-letter="E">Mi</button>
                    <button class="note-btn" data-letter="F">Fa</button>
                    <button class="note-btn" data-letter="G">Sol</button>
                    <button class="note-btn" data-letter="A">La</button>
                    <button class="note-btn" data-letter="B">Si</button>
                </div>
            </div>
            
            <div class="selector-section">
                <h3 class="selector-label">Altération</h3>
                <div class="accidental-buttons">
                    <button class="accidental-btn" data-accidental="bb">𝄫</button>
                    <button class="accidental-btn" data-accidental="b">♭</button>
                    <button class="accidental-btn" data-accidental="#">♯</button>
                    <button class="accidental-btn" data-accidental="##">𝄪</button>
                </div>
            </div>
        </div>

        <button id="submit-btn" class="submit-btn">Vérifier</button>
        <button id="next-btn" class="next-btn" style="display: none;">Question Suivante</button>
        </div>

        <div id="notes-exercise" class="exercise-content">
            <div class="score-board">
                <div class="score-item">
                    <span class="label">Série:</span>
                    <span id="notes-streak-count" class="count">0</span>
                    <span class="label">/10</span>
                </div>
            </div>

            <div class="timer-display" id="timer-display">5</div>

            <canvas id="staff-canvas" width="600" height="300"></canvas>

            <div class="note-buttons-simple">
                <button class="note-btn-simple" data-note="C">Do</button>
                <button class="note-btn-simple" data-note="D">Ré</button>
                <button class="note-btn-simple" data-note="E">Mi</button>
                <button class="note-btn-simple" data-note="F">Fa</button>
                <button class="note-btn-simple" data-note="G">Sol</button>
                <button class="note-btn-simple" data-note="A">La</button>
                <button class="note-btn-simple" data-note="B">Si</button>
            </div>

            <div class="feedback" id="notes-feedback"></div>
        </div>

        <div id="time-signatures-exercise" class="exercise-content">
            <div class="score-board">
                <div class="score-item">
                    <span class="label">Série:</span>
                    <span id="time-streak-count" class="count">0</span>
                    <span class="label">/10</span>
                </div>
            </div>

            <canvas id="time-signature-canvas" width="600" height="200"></canvas>

            <div class="time-signature-selector">
                <div class="selector-section">
                    <h3 class="selector-label">Temps par mesure</h3>
                    <div class="beats-buttons">
                        <button class="beats-btn" data-beats="1">1</button>
                        <button class="beats-btn" data-beats="2">2</button>
                        <button class="beats-btn" data-beats="3">3</button>
                        <button class="beats-btn" data-beats="4">4</button>
                    </div>
                </div>
                
                <div class="selector-section">
                    <h3 class="selector-label">Unité de temps</h3>
                    <div class="unit-buttons">
                        <button class="unit-btn" data-unit="croche">Croche (♪)</button>
                        <button class="unit-btn" data-unit="noire">Noire (♩)</button>
                        <button class="unit-btn" data-unit="noire pointée">Noire pointée (♩.)</button>
                        <button class="unit-btn" data-unit="blanche">Blanche (𝅗𝅥)</button>
                    </div>
                </div>

                <div class="selector-section">
                    <h3 class="selector-label">Type</h3>
                    <div class="type-buttons">
                        <button class="type-btn" data-type="binaire">Binaire</button>
                        <button class="type-btn" data-type="ternaire">Ternaire</button>
                    </div>
                </div>
            </div>

            <button id="time-submit-btn" class="submit-btn">Vérifier</button>

            <div class="feedback" id="time-feedback"></div>
        </div>
    </div>

    <script type="module" src="dist/script.js"></script>
</body>
</html>
